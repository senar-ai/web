name: Test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    # Branch protection requires a check with this name.
    name: 🔬 Lint
    if: github.repository == 'senar-ai/web' && !contains(github.head_ref, 'all-contributors')
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Fetch sheet
        run: npm run fetch

      - name: Build
        run: npm run build
