name: 🤸🏽 Scheduled Deploy
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  deploy:
    name: 🤸🏽 Refresh Data & Deploy
    if: github.repository == 'senar-ai/web'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🐑 Clone repository
        uses: actions/checkout@v4

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Deno 2.9.6 duplicates boolean flags passed to `deno deploy`.
          deno-version: v2.9.4

      - name: 🚛 Deploy to Deno Deploy
        run: deno deploy --prod --json --non-interactive --org "$DENO_DEPLOY_ORG" --app "$DENO_DEPLOY_APP"
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG }}
          DENO_DEPLOY_APP: ${{ vars.DENO_DEPLOY_APP }}
